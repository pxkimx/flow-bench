<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Bench</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* Light | Dark: remembered, applied before first paint; honours Toolbox Launcher's ?appearance= and message */
(function(){var d=document.documentElement,t="light";try{var s=localStorage.getItem("flowbench-theme");if(s==="light"||s==="dark")t=s;
var a=new URLSearchParams(location.search).get("appearance");if(a==="light"||a==="dark"){t=a;localStorage.setItem("flowbench-theme",a)}}catch(e){}
d.setAttribute("data-theme",t);
window.addEventListener("message",function(e){var m=e.data;if(m&&m.type==="toolbox-appearance"&&(m.appearance==="light"||m.appearance==="dark")){if(window.setTheme)window.setTheme(m.appearance);else d.setAttribute("data-theme",m.appearance)}})})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<symbol id="i-prev" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>

<symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol>
<symbol id="i-range" viewBox="0 0 24 24"><path d="M5 5v14M19 5v14M5 12h14"/></symbol>
<symbol id="i-quad" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol>
<symbol id="i-one" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="1.5"/><path d="M9 9h6M9 13h6"/></symbol>
<symbol id="i-grp" viewBox="0 0 24 24"><rect x="4" y="6" width="9" height="12" rx="1.5"/><path d="M16 8h3.5v12H11"/></symbol>
<symbol id="i-all" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></symbol>
<symbol id="i-dens" viewBox="0 0 24 24"><path d="M4 4v16h16"/><circle cx="10" cy="14" r="2.6"/><circle cx="15.5" cy="8.5" r="1.8"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M6 18c2 0 2-9 5-9s2 5 4 5 2-3 4-3"/></symbol>
<symbol id="i-tab" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 10h16M10 5v14"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 20v-7M12 20V8M17 20v-10"/></symbol>
<symbol id="i-prism" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v6M9.5 12.5L12 15l2.5-2.5"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
<symbol id="i-pdf" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 13h5M10 16h5"/></symbol>

<symbol id="i-gml" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></symbol>
<symbol id="i-gate" viewBox="0 0 24 24"><path d="M5 9l8-5 7 6-3 9H8z"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.2"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.5v.1"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></symbol>
<symbol id="i-new" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1H3z"/><path d="M3 11h18l-2 8H5z"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>

<symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19L16 8M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.3L21 14l-1.3.7L19 16l-.7-1.3L17 14l1.3-.7z"/></symbol>

<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M19 14v5H5V5h5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
</defs></svg>

<header class="titlebar">
  <span class="logo"><svg class="i"><use href="#i-logo"/></svg></span><span class="name">Flow Bench</span><span class="doc" id="docname"></span>
  <span class="sp"></span>
  <div class="pill" id="themePill" role="group" aria-label="Appearance">
    <button data-t="light"><svg class="i"><use href="#i-sun"/></svg>Light</button>
    <button data-t="dark"><svg class="i"><use href="#i-moon"/></svg>Dark</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="ribbon" id="ribbon" role="toolbar" aria-label="Tools"></div>

<main id="main">
  <section id="v-start" class="view"></section>
  <section id="v-layout" class="view work">
    <div class="dock l">
      <div class="pn"><h4>Data list<span id="dlCount"></span></h4><div class="bd scroll" id="dataList"></div></div>
      <div class="pn"><h4>Gate view<span>events &nbsp; % parent</span></h4><div class="bd scroll" id="gateView"></div></div>
    </div>
    <div class="desk"><div class="page" id="page">
      <div class="ph"><b id="pgTitle"></b><span id="pgMeta"></span><span class="sp" id="pgNote"></span></div>
      <div class="objs" id="objs"></div>
    </div></div>
    <div class="dock r">
      <div class="pn"><h4>Selected gate</h4><div id="selGate"></div></div>
      <div class="pn"><h4>Prism link</h4><div id="prismCard"></div></div>
      <div class="pn"><h4>Checks<span id="ckCount"></span></h4><div class="scroll" id="checks"></div></div>
    </div>
  </section>
  <section id="v-data" class="view pad"></section>
  <section id="v-comp" class="view pad"></section>
  <section id="v-stats" class="view pad"></section>
  <section id="v-export" class="view pad"></section>
</main>

<footer class="status"><span id="stFile"></span><span id="stEvents"></span><span id="stCyt"></span><span class="sp" id="stCredit"></span><span id="stVer"></span></footer>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div><i></i><span id="busyText">Working…</span></div></div>
<dialog id="ask"><form method="dialog"><h3 id="askTitle"></h3><p id="askText"></p><input id="askInput" autocomplete="off"><div class="row"><button value="cancel" class="btn">Cancel</button><button value="ok" class="btn go" id="askOk">OK</button></div></form></dialog>
<div id="drop" class="drop" hidden><div>Drop FCS files to add them</div></div>
<script src="app.js"></script>
</body>
</html>
